<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celsy Na Atuu >< 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #ffe6e9, #fbc2eb);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      color: #4a4a4a;
      position: relative;
    }

    /* --- LANDING PAGE / ANIMASI AWALAN --- */
    #landing-page {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ff9a9e, #fecfef);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      text-align: center;
      padding: 20px;
    }

    .envelope-card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(255, 71, 126, 0.3);
      backdrop-filter: blur(8px);
      max-width: 380px;
      width: 100%;
      animation: pulse 2s infinite ease-in-out;
    }

    .envelope-icon {
      font-size: 4rem;
      margin-bottom: 15px;
      display: inline-block;
      animation: bounce 1.5s infinite;
    }

    .landing-title {
      font-family: 'Caveat', cursive;
      font-size: 2.5rem;
      color: #ff477e;
      margin-bottom: 10px;
    }

    .landing-subtitle {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 25px;
    }

    .start-btn {
      background: linear-gradient(45deg, #ff477e, #ff70a6);
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 71, 126, 0.4);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 25px rgba(255, 71, 126, 0.6);
    }

    /* --- KONTEN UTAMA --- */
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 35px 25px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.7);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1s ease 0.3s, transform 1s ease 0.3s;
      position: relative;
      z-index: 2;
    }

    .card.show {
      opacity: 1;
      transform: translateY(0);
    }

    h1 {
      font-family: 'Caveat', cursive;
      font-size: 3rem;
      color: #5a5657;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #777;
      margin-bottom: 25px;
    }

    /* Galeri Polaroid */
    .gallery {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .polaroid {
      background: #fff;
      padding: 12px 12px 22px 12px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      width: 175px;
    }

    .polaroid:nth-child(1) {
      transform: rotate(-5deg);
    }

    .polaroid:nth-child(2) {
      transform: rotate(5deg);
    }

    .polaroid:hover {
      transform: scale(1.08) rotate(0deg);
      box-shadow: 0 15px 30px rgba(255, 71, 126, 0.35);
      z-index: 10;
    }

    .polaroid img {
      width: 100%;
      height: 185px;
      object-fit: cover;
      border-radius: 6px;
    }

    .polaroid p {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: #ff477e;
      margin-top: 10px;
      font-weight: 700;
    }

    /* Pesan Romantis */
    .message-box {
      background: #fff0f3;
      padding: 18px;
      border-radius: 15px;
      border-left: 5px solid #ff477e;
      font-size: 0.92rem;
      line-height: 1.7;
      margin-bottom: 25px;
      color: #555;
      text-align: left;
    }

    /* Tombol Interaktif */
    .btn {
      background: linear-gradient(45deg, #ff477e, #ff70a6);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 71, 126, 0.4);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(255, 71, 126, 0.6);
    }

    /* Tombol Musik Melayang */
    .music-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      border: 2px solid #ff477e;
      color: #ff477e;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      z-index: 100;
      transition: all 0.3s ease;
    }

    .music-control:hover {
      transform: scale(1.1);
      background: #ff477e;
      color: white;
    }

    /* Efek Hati */
    .heart {
      position: fixed;
      color: #ff477e;
      font-size: 20px;
      user-select: none;
      pointer-events: none;
      animation: floatUp 4s linear forwards;
      z-index: 1;
    }

    /* Keyframes Animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Audio Background (Ganti URL mp3 di atribut src jika ingin lagu lain) -->
  <audio id="bg-music" loop>
    <source src="mygirl.mp3" type="audio/mpeg">
    Browser kamu tidak mendukung pemutaran audio.
  </audio>

  <!-- Halaman Awalan / Landing Page -->
  <div id="landing-page">
    <div class="envelope-card">
      <div class="envelope-icon">💌</div>
      <h2 class="landing-title">Special Message</h2>
      <p class="landing-subtitle">Ada pesan spesial dari orang yang spesial. Klik tombol di bawah ya! ✨</p>
      <button class="start-btn" onclick="openMessage()">
        Buka Surat Ini ❤️
      </button>
    </div>
  </div>

  <!-- Konten Utama Website -->
  <div class="card" id="main-content">
    <h1>My Girl, My Girl 💕</h1>
    <p class="subtitle"><3.</p>

    <!-- Galeri 2 Foto Polaroid -->
    <div class="gallery">
      <div class="polaroid">
        <img src="foto1.jpg" alt="Foto Us 1" onerror="this.src='https://placehold.co/170x185/ffccd5/ff477e?text=Foto+1'">
        <p>Us ❤️</p>
      </div>
      <div class="polaroid">
        <img src="foto2.jpg" alt="Foto Us 2" onerror="this.src='https://placehold.co/170x185/ffccd5/ff477e?text=Foto+2'">
        <p>My Favorite Person</p>
      </div>
    </div>

    <!-- Kotak Pesan Romantis -->
    <div class="message-box">
      thalia t nya TAI
    </div>

    <!-- Tombol Interaktif -->
    <button class="btn" onclick="sendLove()">Klik untuk Kirim Love 💕</button>
  </div>

  <!-- Tombol Control Musik Melayang -->
  <div class="music-control" id="music-btn" onclick="toggleMusic()" title="Play/Pause Musik">
    🎵
  </div>

  <script>
    const bgMusic = document.getElementById('bg-music');
    const landingPage = document.getElementById('landing-page');
    const mainContent = document.getElementById('main-content');
    const musicBtn = document.getElementById('music-btn');
    let isPlaying = false;

    // Fungsi membuka surat dan menyalakan musik
    function openMessage() {
      // Putar musik
      bgMusic.play().then(() => {
        isPlaying = true;
        musicBtn.innerHTML = '🎵';
      }).catch(err => {
        console.log("Audio play blocked or error: ", err);
      });

      // Transisi hilangkan landing page
      landingPage.style.opacity = '0';
      landingPage.style.visibility = 'hidden';

      // Tampilkan konten utama
      mainContent.classList.add('show');

      // Jalankan animasi hati otomatis
      setInterval(createHeart, 600);

      // Semburan love selamat datang
      for (let i = 0; i < 20; i++) {
        setTimeout(createHeart, i * 100);
      }
    }

    // Toggle Play/Pause Musik
    function toggleMusic() {
      if (isPlaying) {
        bgMusic.pause();
        musicBtn.innerHTML = '🔇';
        isPlaying = false;
      } else {
        bgMusic.play();
        musicBtn.innerHTML = '🎵';
        isPlaying = true;
      }
    }

    // Efek memunculkan hati saat tombol diklik
    function sendLove() {
      for (let i = 0; i < 18; i++) {
        setTimeout(createHeart, i * 120);
      }
    }

    // Fungsi membuat partikel hati berterbangan
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      
      // Pilih variasi icon hati
      const hearts = ['❤️', '💖', '💕', '💗', '🌸'];
      heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
      
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 2 + 3 + 's';
      heart.style.fontSize = Math.random() * 15 + 15 + 'px';
      
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }
  </script>
</body>
</html>
